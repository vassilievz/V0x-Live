[build]
builder = "DOCKERFILE"
dockerfilePath = "infrastructure/docker/Dockerfile.livekit"
watchPatterns = [
  "infrastructure/docker/Dockerfile.livekit",
  "infrastructure/docker/livekit-entrypoint.sh",
]

[deploy]
restartPolicyType = "ON_FAILURE"
healthcheckPath = "/"
healthcheckTimeout = 120

# Variables: REDIS_URL, LIVEKIT_KEYS, PORT=8080 (com TCP proxy na 7881)
# Painel: Settings → Config-as-code → infrastructure/livekit/railway.toml
